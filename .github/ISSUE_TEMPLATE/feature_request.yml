name: Feature Request
description: Suggest a new feature for Eon
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill in the form below.
  
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clear description of the feature
      placeholder: What feature would you like?
    validations:
      required: true
  
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed?
      placeholder: What problem does this solve?
    validations:
      required: true
  
  - type: textarea
    id: implementation
    attributes:
      label: Proposed Implementation
      description: How would you implement this?
      placeholder: Any ideas on how to implement?
    validations:
      required: false
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues
          required: true
        - label: This is a valuable feature for Eon
          required: true
